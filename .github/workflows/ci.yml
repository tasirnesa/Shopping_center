name: Shopping Center CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
  name: Backend - Build and Test
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: backend

  steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      working-directory: .
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate --schema=prisma/schema.prisma

    - name: Build backend
      run: npm run build

    - name: Test backend
      run: npm test

  web:
    name: Web - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build --workspace=web

  mobile:
    name: Mobile - Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile
        run: npm run lint --workspace=mobile